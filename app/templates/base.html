<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BetterMesh by BetterRX</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .brand { display: flex; align-items: center; gap: 14px; }
    .roles { display: flex; align-items: center; gap: 12px; }
    .session-info { color: #b7c6d8; font-size: 14px; }
    .logout-form { margin: 0; }
    .logout-form button.ghost { color: #b7c6d8; border-color: rgba(255, 255, 255, 0.3); background: transparent; }
    .logout-form button.ghost:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
    .hospice-mark { height: 100px; width: auto; }
    {% if hospice_brand %}
    :root {
      --bg: {{ hospice_brand.bg }};
      --panel: {{ hospice_brand.panel }};
      --line: {{ hospice_brand.line }};
      --text: {{ hospice_brand.ink }};
      --muted: {{ hospice_brand.muted }};
      --accent: {{ hospice_brand.accent }};
      --accent-dark: {{ hospice_brand.accent }};
      /* --header-bg is separate from --navy (which is also a dark text
         color elsewhere on the board — see style.css) so overriding the
         topbar background can't wash out unrelated card text. Uses the same
         light --panel treatment as the hospice's own care-platform header
         (rather than a solid block of --accent) so a transparent logo sits
         naturally on it instead of needing a white box behind it. */
      --header-bg: {{ hospice_brand.panel }};
      --header-ink: {{ hospice_brand.ink }};
    }
    .topbar { border-bottom: 1px solid var(--line); }
    .session-info, .roles a { color: var(--header-ink); }
    .logout-form button.ghost { color: var(--header-ink); border-color: {{ hospice_brand.accent }}88; }
    .logout-form button.ghost:hover { background: {{ hospice_brand.accent }}18; }
    {% endif %}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      {% if hospice_brand %}
      <img class="hospice-mark" src="/static/logos/{{ hospice_brand.logo }}" alt="{{ hospice_brand.name }}">
      {% else %}
      <span class="brand-main">BetterMesh</span>
      <span class="brand-sub">by BetterRX</span>
      {% endif %}
    </div>
    {% if user %}
    <nav class="roles">
      <span class="session-info">
        {{ user.display_name }}{% if user.vendor %} · {{ user.vendor }}{% endif %}{% if user.hospice %} · {{ user.hospice }}{% endif %}
      </span>
      <form method="post" action="/logout" class="logout-form">
        <button type="submit" class="ghost">Log out</button>
      </form>
    </nav>
    {% endif %}
  </header>

  <main id="board" data-highlight-patient="{{ highlight_patient or '' }}">
    {% block board %}{% endblock %}
  </main>

  <script>
    (function () {
      var board = document.getElementById('board');
      var target = board && board.dataset.highlightPatient;
      if (!target) return;
      var card = board.querySelector('.hcard[data-patient="' + target + '"]');
      if (!card) return;
      card.classList.add('hcard-highlight');
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    })();
  </script>
</body>
</html>
